name = "tic-tac-toe-do"
main = "src/index.ts"
compatibility_date = "2026-03-20"

# Required secrets/vars (set via `wrangler secret put` / `wrangler var put`):
# - TURNSTILE_SECRET_KEY: Your Cloudflare Turnstile secret key (Secret)
# - TURNSTILE_SITE_KEY: Your Cloudflare Turnstile site key (Plain text var or Secret)

routes = [
  { pattern = "tictactoe.ksanthoshkumar.com/*", zone_name = "ksanthoshkumar.com" }
]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "TicTacToe"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TicTacToe"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
